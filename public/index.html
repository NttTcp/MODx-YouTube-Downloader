<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YT Downloader</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0a0a0f; }
  .blob { position:fixed; border-radius:9999px; filter:blur(120px); pointer-events:none; }
</style>
</head>
<body class="text-white min-h-screen overflow-x-hidden">

<div class="blob" style="top:-200px;left:-200px;width:500px;height:500px;background:rgba(147,51,234,.25)"></div>
<div class="blob" style="bottom:-200px;right:-200px;width:500px;height:500px;background:rgba(236,72,153,.2)"></div>

<main class="relative z-10 max-w-3xl mx-auto px-5 py-16">

  <div class="text-center mb-12">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs text-purple-300 mb-6">
      <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
      Fast • Free • No Ads
    </div>
    <h1 class="text-5xl md:text-6xl font-bold mb-3 bg-gradient-to-r from-purple-400 via-pink-400 to-blue-400 bg-clip-text text-transparent">
      YT Downloader
    </h1>
    <p class="text-slate-400">YouTube video ko MP3 ya MP4 me download karo.</p>
  </div>

  <div class="flex gap-2 p-2 bg-white/5 border border-white/10 rounded-2xl backdrop-blur-xl">
    <input id="url" placeholder="YouTube link paste karo..."
      class="flex-1 bg-transparent px-4 py-3 outline-none text-sm placeholder:text-slate-500" />
    <button id="fetchBtn"
      class="px-6 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 font-semibold text-sm hover:opacity-90 disabled:opacity-40">
      Fetch
    </button>
  </div>

  <div id="error" class="hidden mt-4 p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-red-300 text-sm"></div>

  <div id="result" class="hidden mt-8 bg-white/5 border border-white/10 rounded-2xl p-5 backdrop-blur-xl">
    <div class="flex gap-4">
      <img id="thumb" class="w-40 h-24 object-cover rounded-lg" />
      <div class="min-w-0 flex-1">
        <h2 id="title" class="font-semibold line-clamp-2"></h2>
        <p id="author" class="text-xs text-slate-400 mt-1"></p>
        <p id="duration" class="text-xs text-slate-500 mt-0.5"></p>
      </div>
    </div>

    <h3 class="mt-6 mb-3 text-sm font-semibold text-slate-300">🎵 Audio</h3>
    <button onclick="dl('audio')"
      class="w-full p-4 rounded-xl bg-gradient-to-r from-green-500/20 to-emerald-500/10 border border-green-500/30 hover:border-green-400 transition text-left">
      <div class="font-semibold text-green-300">Download Audio (M4A)</div>
      <div class="text-xs text-slate-400 mt-0.5">Best quality available</div>
    </button>

    <h3 class="mt-6 mb-3 text-sm font-semibold text-slate-300">🎬 Video</h3>
    <div id="videos" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
  </div>

  <p class="text-center text-xs text-slate-600 mt-12">Powered by yt-dlp • Vercel</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
let currentUrl = '';

$('fetchBtn').onclick = async () => {
  const url = $('url').value.trim();
  if (!url) return;
  $('error').classList.add('hidden');
  $('result').classList.add('hidden');
  $('fetchBtn').textContent = 'Loading...';
  $('fetchBtn').disabled = true;

  try {
    const r = await fetch('/api/info?url=' + encodeURIComponent(url));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    currentUrl = url;
    render(d);
  } catch (e) {
    $('error').textContent = '⚠️ ' + e.message;
    $('error').classList.remove('hidden');
  } finally {
    $('fetchBtn').textContent = 'Fetch';
    $('fetchBtn').disabled = false;
  }
};

function render(d) {
  $('thumb').src = d.thumbnail;
  $('title').textContent = d.title;
  $('author').textContent = d.author;
  const s = d.duration;
  $('duration').textContent = '⏱ ' + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');

  const box = $('videos');
  box.innerHTML = '';
  if (!d.formats.length) {
    box.innerHTML = '<p class="text-xs text-slate-500 col-span-full">Koi combined format nahi mila.</p>';
  }
  d.formats.forEach(f => {
    const size = f.size ? (f.size/1024/1024).toFixed(1) + ' MB' : '';
    const b = document.createElement('button');
    b.className = 'p-3 rounded-xl bg-white/5 border border-white/10 hover:border-purple-400/60 transition text-left text-sm';
    b.innerHTML = `<div class="font-semibold text-purple-300">${f.quality}</div>
                   <div class="text-[10px] text-slate-500">${f.ext.toUpperCase()} ${size}</div>`;
    b.onclick = () => dl('video', f.format_id);
    box.appendChild(b);
  });

  $('result').classList.remove('hidden');
}

function dl(type, fmt) {
  if (!currentUrl) return;
  let u = '/api/download?url=' + encodeURIComponent(currentUrl) + '&type=' + type;
  if (fmt) u += '&format_id=' + fmt;
  const a = document.createElement('a');
  a.href = u;
  a.download = '';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
</script>
</body>
</html>
